<!DOCTYPE html>
<html lang="pl">
<head>
<meta name="google-site-verification" content="Muvk95dEONPRFxYAFOzcfUVj0GOQMCNulG1ZDu7YKn0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitlr</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0d0d0f;
  --surface:#17171a;
  --card:#1e1e23;
  --border:rgba(255,255,255,0.08);

  --text:#f0f0ee;
  --muted:#7a7a85;

  --blue:#378ADD;
  --blue-track:rgba(55,138,221,0.18);

  --green:#639922;
  --green-track:rgba(99,153,34,0.18);

  --accent:#c8f04d;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  padding:0 0 2rem;
}

header{
  padding:1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:1.5rem;
}

.logo span{
  color:var(--accent);
}

.date{
  font-size:0.75rem;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--border);
  padding:4px 10px;
  border-radius:100px;
}

#login-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:80vh;
  padding:2rem;
  text-align:center;
  gap:1.5rem;
}

#connect-btn{
  padding:0.85rem 2rem;
  background:var(--accent);
  color:#0d0d0f;
  border:none;
  border-radius:14px;
  font-family:'Syne',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
}

#privacy-btn{
  margin-top:10px;
  padding:0.7rem 1.5rem;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:12px;
  font-family:'DM Sans';
  cursor:pointer;
  font-size:0.85rem;
}

#app-screen{
  display:none;
}

.loading{
  padding:4rem;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 1rem;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.sync-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 1.5rem 1rem;
}

.sync-btn{
  padding:0.5rem 1rem;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--muted);
  font-size:0.8rem;
  cursor:pointer;
}

/* reszta twojego CSS bez zmian */
</style>
</head>

<body>

<header>
  <div class="logo">Fit<span>lr</span></div>
  <div class="date" id="hdr-date"></div>
</header>

<div id="login-screen">

  <div style="font-size:4rem">👑</div>

  <h2 style="font-family:'Syne'">
    Witaj w Fitlr
  </h2>

  <p style="color:var(--muted)">
    Twoje cele w jednym miejscu.
  </p>

  <button id="connect-btn" onclick="signIn()">
    Połącz z Google Fit
  </button>

  <!-- TU JEST FIX, Daniik -->
  <a href="https://d4n1iik.github.io/Fitlr/privacy" style="text-decoration:none;">
    <button id="privacy-btn">
      Privacy Policy
    </button>
  </a>

</div>

<div id="app-screen">

  <div id="loading-state" class="loading">
    <div class="spinner"></div>
    Synchronizuję dane...
  </div>

  <div id="main-content" style="display:none">

    <div class="sync-row">
      <span id="sync-time" style="font-size:0.75rem;color:var(--muted)"></span>

      <button class="sync-btn" onclick="fetchFitData()">
        ↻ Odśwież
      </button>
    </div>

    <!-- reszta twojej aplikacji BEZ zmian -->

  </div>

</div>

<script>
const CLIENT_ID =
'72149566564-2m1rinft6vj3pshomjrjrl2rdn2jdjjh.apps.googleusercontent.com';

const STEP_GOAL = 10000;
const CAL_GOAL = 500;

let accessToken = null;

document.getElementById('hdr-date').textContent =
new Date().toLocaleDateString('pl-PL',{
  weekday:'short',
  day:'numeric',
  month:'short'
});

function signIn(){

  const client =
  google.accounts.oauth2.initTokenClient({

    client_id:CLIENT_ID,

    scope:'https://www.googleapis.com/auth/fitness.activity.read',

    callback:(resp)=>{

      if(resp.access_token){

        accessToken = resp.access_token;

        document.getElementById('login-screen').style.display='none';

        document.getElementById('app-screen').style.display='block';

        fetchFitData();
      }
    }
  });

  client.requestAccessToken();
}
</script>

</body>
</html>
